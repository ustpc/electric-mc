[package]
name = "emc-notes"
version = "0.1.0"
edition = "2021"
description = "Electric MC notes server: AWS Lambda behind a function URL, DynamoDB on demand"
license = "GPL-3.0"
publish = false

[[bin]]
name = "bootstrap"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-dynamodb = "1"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
lambda_http = "0.14"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
