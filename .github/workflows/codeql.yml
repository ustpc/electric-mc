# GitHub code scanning (CodeQL): security bugs in the extension's TypeScript
# and the Python tools. Free for public repositories. Results are under the
# repository's Security tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config: |
            paths-ignore:
              - extension/build
              - extension/public
              - '**/node_modules'
      - uses: github/codeql-action/analyze@v4
