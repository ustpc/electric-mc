# Typechecks, tests (with coverage), builds and load-tests the extension on every push
# and pull request. The coverage table goes in the run summary and, on pull
# requests, in a comment; the HTML report is the "coverage" artifact.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    # 24.04: Playwright 1.56 has no Chromium build for newer Ubuntu.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build
      # Load the built extension into headless Chromium, reload it twice (as
      # an update does) and fail on any error Chrome records for it.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:load

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: extension/coverage/
          if-no-files-found: ignore

      - name: Coverage summary and PR comment
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: extension
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
