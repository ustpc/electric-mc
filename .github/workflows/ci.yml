# Typechecks, lints, tests (with coverage), builds and load-tests the extension on every push
# and pull request, and checks the notes server, the Python tools and the
# whole repository for real MC data. The coverage table goes in the run summary and, on pull
# requests, in a comment; the HTML report is the "coverage" artifact. Coverage for
# the extension (Vitest), the notes server (Rust) and the Python tools is also
# uploaded to Codecov (https://app.codecov.io/gh/ustpc/electric-mc), one flag
# each; uploads authenticate with GitHub OIDC, so no token secret is needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  # Codecov uploads authenticate with a GitHub OIDC token.
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    # 24.04: Playwright 1.56 has no Chromium build for newer Ubuntu.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      # onnxruntime-node (a dependency of Transformers.js, used only by
      # `make ae-profiles` on a Mac) downloads its optional CUDA binaries from
      # api.nuget.org on install; a timeout there failed CI on main after
      # PR #75. Nothing here needs them.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build
      # Chrome Web Store policy (MV3): no remotely hosted code. The build runs
      # this check too; it is repeated here so a failure is easy to spot.
      - run: npm run check:remote-code
      # Every permission the manifest asks for must be in permissions.json
      # (AGENTS.md: new permissions are flagged first).
      - run: npm run check:permissions
      # Load the built extension into headless Chromium, reload it twice (as
      # an update does) and fail on any error Chrome records for it.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:load
      # A synthetic details page in real Chromium: read as a manuscript page,
      # one-button controls shown (jsdom alone missed a Chrome-only bug).
      - run: npm run test:page

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: extension/coverage/
          if-no-files-found: ignore

      - name: Coverage summary and PR comment
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: extension
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: extension/coverage/lcov.info
          flags: extension
          disable_search: true
          fail_ci_if_error: false

  real-data:
    # AGENTS.md: real Manuscript Central data never goes in this repository.
    # The check looks at shapes (IDs outside the synthetic ranges, emails
    # outside example.org, capture files); it prints where, never what.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tools/privacy/check-no-real-data.mjs

  notes-server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/notes
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/notes
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Runs the tests once, instrumented, and writes an LCOV report.
      - run: cargo llvm-cov --all-targets --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: backend/notes/lcov.info
          flags: notes-server
          disable_search: true
          fail_ci_if_error: false

  python-tools:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check .
      - run: uvx --with playwright --with psutil --with keyring --with pytest --with pillow pyright
      - run: >-
          uv run --with pytest --with pytest-cov --with keyring --with playwright --with psutil
          pytest -q tools/mc-watch --cov=tools/mc-watch --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          flags: python-tools
          disable_search: true
          fail_ci_if_error: false
