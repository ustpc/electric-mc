# Uploads the extension to the Chrome Web Store and submits it for review.
# Runs when a tag like extension-v0.0.22 is pushed (the tag must match
# extension/package.json), or by hand from the Actions tab. By hand, untick
# "submit" to only upload: that checks the credentials and leaves a draft in
# the dashboard without sending anything for review.
# Setup and secrets: doc/Chrome Web Store listing.md, section 6.
name: Chrome Web Store

on:
  push:
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      staged:
        description: 'Hold the approved version until it is published by hand'
        type: boolean
        default: false
      submit:
        description: 'Submit for review after uploading (untick to only upload)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: chrome-web-store
    defaults:
      run:
        working-directory: extension
    env:
      PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      ITEM_ID: ${{ vars.CWS_ITEM_ID }}
      API: https://chromewebstore.googleapis.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME#extension-v}" = "$version" \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run zip:store

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload the package
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          zip=$(ls build/*-chrome.zip)
          echo "Uploading $zip"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/zip" \
            --data-binary @"$zip" \
            "$API/upload/v2/publishers/$PUBLISHER_ID/items/$ITEM_ID:upload" | tee upload.json
          # Large uploads are processed asynchronously; wait for them to finish.
          for i in $(seq 1 30); do
            state=$(curl -sS --fail-with-body -H "Authorization: Bearer $TOKEN" \
              "$API/v2/publishers/$PUBLISHER_ID/items/$ITEM_ID:fetchStatus" | tee status.json \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).lastAsyncUploadState||""))')
            echo "Upload state: ${state:-none}"
            [ "$state" != "IN_PROGRESS" ] && break
            sleep 10
          done
          [ "$state" = "FAILED" ] && { cat status.json; exit 1; } || true

      - name: Submit for review
        if: github.event_name != 'workflow_dispatch' || inputs.submit
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          STAGED: ${{ inputs.staged }}
        run: |
          body='{}'
          [ "$STAGED" = "true" ] && body='{"publishType":"STAGED_PUBLISH"}'
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$body" \
            "$API/v2/publishers/$PUBLISHER_ID/items/$ITEM_ID:publish"
